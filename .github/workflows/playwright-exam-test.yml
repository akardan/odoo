name: Playwright Exam Load Test

# Manuel tetikleme ve zamanlanmış çalıştırma
on:
  workflow_dispatch:
    inputs:
      survey_token:
        description: '16a184a0-d826-4451-bb61-ce4754b1526d'
        required: true
        type: string
      base_url:
        description: 'Base URL (varsayılan: https://digipharma.com.tr)'
        required: false
        default: 'https://digipharma.com.tr'
        type: string
      user_count:
        description: 'Toplam kullanıcı sayısı'
        required: false
        default: '50'
        type: string
      parallel_count:
        description: 'Paralel çalışacak kullanıcı sayısı (GitHub Actions için max 10 önerilir)'
        required: false
        default: '10'
        type: string
  # İsteğe bağlı: Schedule ile otomatik çalıştırma
  # schedule:
  #   - cron: '0 2 * * *'  # Her gün saat 02:00'de çalış

jobs:
  playwright-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 saat maksimum
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r addons-custom/ak_exams/tests/load_test/requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run Playwright Load Test
        env:
          SURVEY_TOKEN: ${{ github.event.inputs.survey_token || secrets.SURVEY_TOKEN }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://digipharma.com.tr' }}
          USER_COUNT: ${{ github.event.inputs.user_count || '50' }}
          PARALLEL: ${{ github.event.inputs.parallel_count || '10' }}
          HEADLESS: 'true'
        run: |
          cd addons-custom/ak_exams/tests/load_test
          python test_exam_playwright.py
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            addons-custom/ak_exams/tests/load_test/playwright_report_*.json
            /tmp/user_*.png
          retention-days: 30
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: /tmp/user_*.png
          retention-days: 7
      
      - name: Comment PR with results (optional)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportFiles = fs.readdirSync('addons-custom/ak_exams/tests/load_test')
              .filter(f => f.startsWith('playwright_report_'));
            
            if (reportFiles.length > 0) {
              const report = JSON.parse(fs.readFileSync(
                `addons-custom/ak_exams/tests/load_test/${reportFiles[0]}`, 
                'utf8'
              ));
              
              const summary = report.summary;
              const successRate = (summary.success / report.test_info.user_count * 100).toFixed(1);
              
              const comment = `## 🎭 Playwright Load Test Results
              
              **Test Configuration:**
              - 👥 Total Users: ${report.test_info.user_count}
              - 🌐 Base URL: ${report.test_info.base_url}
              - ⏱️ Duration: ${(report.test_info.duration_seconds / 60).toFixed(2)} minutes
              
              **Results:**
              - ✅ Success: ${summary.success} (${successRate}%)
              - ❌ Failed: ${summary.failed}
              - 🔥 Critical: ${summary.critical}
              - 📝 Total Questions Answered: ${summary.total_questions_answered}
              
              [Download full report](../actions/runs/${context.runId})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
