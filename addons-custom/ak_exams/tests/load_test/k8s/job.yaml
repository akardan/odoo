apiVersion: batch/v1
kind: Job
metadata:
  name: exam-load-test
  namespace: default
spec:
  # 5 pod ile 100 kullanıcı (her pod 20 kullanıcı)
  parallelism: 5
  completions: 5
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600  # 1 saat sonra temizle
  
  template:
    metadata:
      labels:
        app: exam-load-test
    spec:
      restartPolicy: Never
      
      containers:
      - name: playwright-test
        image: <YOUR_ECR_REPO>/exam-load-test:latest
        
        env:
        - name: SURVEY_TOKEN
          value: "16a184a0-d826-4451-bb61-ce4754b1526d"
        
        - name: BASE_URL
          value: "https://digipharma.com.tr"
        
        - name: USER_COUNT
          value: "20"  # Her pod 20 kullanıcı
        
        - name: PARALLEL
          value: "20"  # Hepsi paralel
        
        - name: HEADLESS
          value: "true"
        
        resources:
          requests:
            memory: "4Gi"     # 20 browser için
            cpu: "2000m"      # 2 CPU
          limits:
            memory: "6Gi"
            cpu: "4000m"      # 4 CPU
        
        # Chromium için shared memory
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi  # 20 browser için yeterli
